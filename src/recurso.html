<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interposição de Recurso - AVALIA+</title>
    <link rel="stylesheet" href="style.css?v=20251216-2">
    <link rel="stylesheet" href="theme.css?v=20251216-2">
    <script src="script.js?v=13"></script>
</head>
<body>
    <div class="container">
        <header class="main-header">
            <div style="display:flex; align-items:center; justify-content:center; gap:15px;">
                <img src="img/logo_planter.png" alt="Logo PLANTERR" style="max-height:80px; width:auto;">
                <h1>Formulário para Interposição de Recurso</h1>
                <img src="img/logo_avalia_horizontal.png" alt="Logo AVALIA+" style="max-height:80px; width:auto;">
            </div>
        </header>

        <section class="panel">
            <div class="panel-header"><h2>Dados do Recurso</h2></div>
            <div class="panel-body">
                <form id="recurso-form">
                    <div class="form-group">
                        <label for="nome">Nome Completo: *</label>
                        <input type="text" id="nome" name="nome" required maxlength="200">
                    </div>

                    <div class="form-group">
                        <label for="cpf">Nº do CPF: *</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required maxlength="14">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail: *</label>
                        <input type="email" id="email" name="email" required maxlength="200">
                    </div>

                    <div class="form-group">
                        <label for="titulo_projeto">Título do Projeto de Pesquisa ou Intervenção: *</label>
                        <input type="text" id="titulo_projeto" name="titulo_projeto" required maxlength="200">
                    </div>

                    <div class="form-group">
                        <label for="linha_pesquisa">Linha de Pesquisa: *</label>
                        <select id="linha_pesquisa" name="linha_pesquisa" required>
                            <option value="">Selecione uma linha de pesquisa...</option>
                            <option value="Linha de Pesquisa 1 – Planejamento Urbano-regional, Ambiental e de Comunidades Tradicionais">Linha de Pesquisa 1 – Planejamento Urbano-regional, Ambiental e de Comunidades Tradicionais</option>
                            <option value="Linha de Pesquisa 2 – Políticas públicas, Planejamento Territorial e Participação Social">Linha de Pesquisa 2 – Políticas públicas, Planejamento Territorial e Participação Social</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="etapa_processo">Etapa do Processo Objeto do Recurso: *</label>
                        <select id="etapa_processo" name="etapa_processo" required>
                            <option value="">Selecione a etapa...</option>
                            <option value="Avaliação do Projeto">Avaliação do Projeto</option>
                            <option value="Entrevista">Entrevista</option>
                            <option value="Prova de Língua Estrangeira">Prova de Língua Estrangeira</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="decisao_contestacao">Decisão Objeto da Contestação (Descrever de forma objetiva o que solicita revisão): *</label>
                        <textarea id="decisao_contestacao" name="decisao_contestacao" required rows="4" maxlength="1000"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="argumentacao">Argumentação: *</label>
                        <textarea id="argumentacao" name="argumentacao" required rows="10" maxlength="2500" oninput="updateCounter(this, 2500)"></textarea>
                        <div class="counter">Caracteres restantes: <span id="argumentacao-counter">2500</span></div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="btn-fill-example" class="btn-secondary" style="background-color: #FFEB3B; color: #333; border: 1px solid #FBC02D;">Preencher Exemplo</button>
                        <button type="submit" class="btn-primary">Enviar Recurso</button>
                    </div>
                </form>

                <div id="appeal-success" style="display:none; margin-top:18px; text-align:center;">
                    <div style="margin-bottom:10px; font-size:12px;">
                        Recurso enviado com sucesso. Protocolo:
                        <strong id="appeal-success-protocol" style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace;"></strong>
                    </div>
                    <a id="appeal-download" class="btn-primary" href="#" target="_blank" rel="noopener">Baixar PDF do recurso</a>
                </div>
            </div>
        </section>

        <div style="text-align:center; margin-top:24px;">
            <a href="index.html" class="btn-secondary">Voltar para página inicial</a>
        </div>
    </div>

    <script>
        // Simple script to handle form submission (placeholder)
        document.getElementById('recurso-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = 'Enviando...';

            try {
                const response = await fetch('/api/appeals', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    const protocol = result && result.protocol ? String(result.protocol) : '';

                    const successBox = document.getElementById('appeal-success');
                    const successProtocol = document.getElementById('appeal-success-protocol');
                    const downloadLink = document.getElementById('appeal-download');

                    if (successProtocol) successProtocol.textContent = protocol;
                    if (downloadLink) downloadLink.href = `/api/appeals/${encodeURIComponent(protocol)}/pdf`;
                    if (successBox) successBox.style.display = 'block';

                    alert(`Recurso enviado com sucesso!\nProtocolo: ${protocol}\n\nClique em "Baixar PDF do recurso" para fazer o download.`);
                    e.target.reset();
                } else {
                    alert(`Erro ao enviar recurso: ${result.error || 'Erro desconhecido'}`);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro de conexão ao enviar recurso.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        });

        // CPF Formatting
        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            
            if (value.length > 9) {
                value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                value = value.replace(/(\d{3})(\d{3})(\d{3})/, '$1.$2.$3');
            } else if (value.length > 3) {
                value = value.replace(/(\d{3})(\d{3})/, '$1.$2');
            }
            
            e.target.value = value;
        });
    </script>
</body>
</html>
