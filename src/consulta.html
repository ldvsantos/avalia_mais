<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Inscrição - AVALIA+</title>
    <link rel="stylesheet" href="style.css?v=20251216-2">
    <link rel="stylesheet" href="theme.css?v=20251216-2">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <div style="display:flex; align-items:center; justify-content:center; gap:15px;">
                <img src="img/logo_planter.png" alt="Logo PLANTERR" style="max-height:80px; width:auto;">
                <h1>Consulta de Inscrição - AVALIA+</h1>
                <img src="img/logo_avalia_horizontal.png" alt="Logo AVALIA+" style="max-height:80px; width:auto;">
            </div>
        </header>

        <section class="panel">
            <div class="panel-header"><h2>Verificação de Autenticidade</h2></div>
            <div class="panel-body">
                <p style="margin:0 0 16px 0;">
                    Para conferir a autenticidade da sua inscrição, informe o número de protocolo que consta no PDF gerado.
                </p>
                <div class="form-group" style="margin-bottom:16px;">
                    <label for="verify-protocol-input">Protocolo</label>
                    <input type="text" id="verify-protocol-input" placeholder="Ex.: PLANTERR-2025-AB12" />
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button id="btn-open-verify" class="btn-primary" type="button">Consultar verificação</button>
                    <a id="verify-link" class="btn-secondary" href="#" target="_blank" rel="noopener noreferrer">Abrir em nova guia</a>
                </div>
                <div style="margin-top:10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; word-break: break-all;">
                    <span id="verify-url"></span>
                </div>
            </div>
        </section>

        <section class="panel" id="result-section" style="display:none;">
            <div class="panel-header"><h2>Resultado da Consulta</h2></div>
            <div class="panel-body">
                <div id="result-content"></div>
            </div>
        </section>

        <div style="text-align:center; margin-top:24px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <a href="inscricao.html" class="btn-primary">Ir para inscrição</a>
            <a href="index.html" class="btn-secondary">Voltar para página inicial</a>
        </div>
    </div>

    <script>
        const verifyProtocolInput = document.getElementById('verify-protocol-input');
        const btnOpenVerify = document.getElementById('btn-open-verify');
        const verifyLink = document.getElementById('verify-link');
        const verifyUrl = document.getElementById('verify-url');
        const resultSection = document.getElementById('result-section');
        const resultContent = document.getElementById('result-content');

        function updateVerifyUrl() {
            const protocol = verifyProtocolInput.value.trim();
            if (!protocol) {
                verifyUrl.textContent = '';
                verifyLink.href = '#';
                return;
            }
            const url = `/api/verify/${encodeURIComponent(protocol)}`;
            verifyUrl.textContent = window.location.origin + url;
            verifyLink.href = url;
        }

        verifyProtocolInput.addEventListener('input', updateVerifyUrl);

        // Suporte a QR Code / deep link: consulta.html?protocol=...&auto=1
        (function initFromQueryString() {
            try {
                const qs = new URLSearchParams(window.location.search);
                const protocol = (qs.get('protocol') || qs.get('p') || '').trim();
                const auto = (qs.get('auto') || '').trim();
                if (!protocol) return;
                verifyProtocolInput.value = protocol;
                updateVerifyUrl();
                if (auto === '1' || auto.toLowerCase() === 'true') {
                    // Pequeno delay para garantir que o DOM terminou de atualizar
                    setTimeout(() => btnOpenVerify.click(), 50);
                }
            } catch (e) {
                console.warn('Falha ao ler querystring:', e);
            }
        })();

        btnOpenVerify.addEventListener('click', async () => {
            const protocol = verifyProtocolInput.value.trim();
            if (!protocol) {
                alert('Por favor, informe o protocolo.');
                return;
            }

            try {
                const response = await fetch(`/api/verify/${encodeURIComponent(protocol)}`);
                const data = await response.json();

                resultSection.style.display = 'block';
                
                if (data.valid) {
                    const info = data.data || data.submission || {};
                    const nome = info.nome || data.identified?.nome || '-';
                    const email = info.email || data.identified?.email || '-';
                    const cpf = info.cpf || data.identified?.cpf || '-';
                    const titulo = info.titulo || data.project?.titulo_pt || '-';
                    const area = info.area || data.project?.area || '-';
                    const createdAt = data.createdAt ? new Date(data.createdAt).toLocaleString('pt-BR') : '-';

                    resultContent.innerHTML = `
                        <div style="padding:16px; background:#d4edda; border:1px solid #c3e6cb; border-radius:4px; margin-bottom:16px;">
                            <div style="color:#155724; font-weight:bold; margin-bottom:8px;">✓ Inscrição válida</div>
                            <div style="color:#155724; font-size:14px;">A inscrição foi encontrada e é autêntica.</div>
                        </div>
                        <table class="admin-table">
                            <tbody>
                                <tr><th>Protocolo</th><td style="font-family: monospace;">${data.protocol || '-'}</td></tr>
                                <tr><th>Data/Hora</th><td>${createdAt}</td></tr>
                                <tr><th>Hash (SHA-256)</th><td style="font-family: monospace; word-break: break-all;">${data.storedHash || 'undefined'}</td></tr>
                                <tr><th>Nome</th><td>${nome}</td></tr>
                                <tr><th>E-mail</th><td>${email}</td></tr>
                                <tr><th>CPF</th><td>${cpf}</td></tr>
                                <tr><th>Título do projeto</th><td>${titulo}</td></tr>
                                <tr><th>Área / Linha de pesquisa</th><td>${area}</td></tr>
                            </tbody>
                        </table>
                        <div id="appeals-container" style="margin-top:16px;"></div>
                    `;

                    // Recursos do candidato (por etapa)
                    (async () => {
                        const container = document.getElementById('appeals-container');
                        if (!container) return;
                        container.innerHTML = `
                            <div style="padding:16px; background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px;">
                                <div style="font-weight:bold; margin-bottom:8px;">Recursos cadastrados</div>
                                <div style="color:#555; font-size:14px;">Carregando recursos...</div>
                            </div>
                        `;

                        try {
                            const r = await fetch(`/api/submissions/${encodeURIComponent(protocol)}/appeals`);
                            const payload = await r.json();
                            const appeals = Array.isArray(payload?.appeals) ? payload.appeals : [];

                            const etapas = [
                                'Avaliação do Projeto',
                                'Entrevista',
                                'Prova de Língua Estrangeira'
                            ];

                            const byEtapa = new Map(etapas.map(e => [e, []]));
                            appeals.forEach(a => {
                                const etapa = String(a?.etapa || '').trim();
                                if (!byEtapa.has(etapa)) byEtapa.set(etapa, []);
                                byEtapa.get(etapa).push(a);
                            });

                            const renderEtapa = (etapaLabel) => {
                                const list = byEtapa.get(etapaLabel) || [];
                                if (list.length === 0) {
                                    return `
                                        <tr>
                                            <td>${etapaLabel}</td>
                                            <td style="color:#666;">Nenhum recurso registrado</td>
                                            <td style="text-align:center;">—</td>
                                        </tr>
                                    `;
                                }

                                // Mostra o mais recente primeiro
                                const sorted = [...list].sort((a, b) => String(b?.createdAt || '').localeCompare(String(a?.createdAt || '')));
                                const latest = sorted[0];
                                const ap = String(latest?.protocol || '').trim();
                                const when = latest?.createdAt ? new Date(latest.createdAt).toLocaleString('pt-BR') : '';
                                const link = ap ? `/api/appeals/${encodeURIComponent(ap)}/pdf` : '#';

                                return `
                                    <tr>
                                        <td>${etapaLabel}</td>
                                        <td style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">${ap || '-'}</td>
                                        <td style="text-align:center;">
                                            ${ap ? `<a class="btn-primary" href="${link}" target="_blank" rel="noopener">Baixar PDF</a><div style="font-size:11px; color:#555; margin-top:4px;">${when}</div>` : '—'}
                                        </td>
                                    </tr>
                                `;
                            };

                            container.innerHTML = `
                                <div style="padding:16px; background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px;">
                                    <div style="font-weight:bold; margin-bottom:8px;">Recursos cadastrados (por etapa)</div>
                                    <div style="overflow-x:auto;">
                                        <table class="admin-table">
                                            <thead>
                                                <tr>
                                                    <th>Etapa</th>
                                                    <th>Protocolo do recurso</th>
                                                    <th style="text-align:center;">PDF</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${etapas.map(renderEtapa).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `;
                        } catch (e) {
                            console.error('Falha ao carregar recursos:', e);
                            container.innerHTML = `
                                <div style="padding:16px; background:#f8d7da; border:1px solid #f5c6cb; border-radius:4px;">
                                    <div style="color:#721c24; font-weight:bold; margin-bottom:8px;">Erro ao carregar recursos</div>
                                    <div style="color:#721c24; font-size:14px;">Não foi possível listar os recursos vinculados a esta inscrição.</div>
                                </div>
                            `;
                        }
                    })();
                } else {
                    resultContent.innerHTML = `
                        <div style="padding:16px; background:#f8d7da; border:1px solid #f5c6cb; border-radius:4px;">
                            <div style="color:#721c24; font-weight:bold; margin-bottom:8px;">✗ Inscrição não encontrada</div>
                            <div style="color:#721c24; font-size:14px;">O protocolo informado não foi encontrado no sistema.</div>
                        </div>
                    `;
                }

                // Scroll suave até o resultado
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (error) {
                console.error('Erro ao verificar:', error);
                resultSection.style.display = 'block';
                resultContent.innerHTML = `
                    <div style="padding:16px; background:#f8d7da; border:1px solid #f5c6cb; border-radius:4px;">
                        <div style="color:#721c24; font-weight:bold; margin-bottom:8px;">✗ Erro na consulta</div>
                        <div style="color:#721c24; font-size:14px;">Não foi possível realizar a consulta. Verifique sua conexão e tente novamente.</div>
                    </div>
                `;
            }
        });

        // Enter para consultar
        verifyProtocolInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnOpenVerify.click();
            }
        });
    </script>
</body>
</html>
