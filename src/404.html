<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - AVALIA+</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <style>
        .error-container {
            text-align: center;
            padding: 50px 20px;
        }
        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #003366;
            margin: 0;
        }
        .error-message {
            font-size: 24px;
            color: #555;
            margin: 20px 0;
        }
        .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #003366;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-home:hover {
            background-color: #002244;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div style="display:flex; align-items:center; justify-content:center; gap:15px;">
            <h1>AVALIA+</h1>
            <img src="img/logo_avalia_horizontal.png" alt="Logo AVALIA+" style="max-height:80px; width:auto;">
        </div>
    </header>

    <div class="container">
        <div class="error-container">
            <h1 class="error-code">404</h1>
            <p class="error-message">Ops! A página que você está procurando não foi encontrada.</p>
            <p>Verifique se o endereço está correto ou retorne para a página inicial.</p>
            <a href="/" class="btn-home">Voltar para o Início</a>
        </div>
    </div>

    <footer style="text-align: center; margin-top: 40px; margin-bottom: 20px; color: #777; font-size: 0.9em;">
        <p>&copy; 2025 AVALIA+. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
