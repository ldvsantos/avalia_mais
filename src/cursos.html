<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos e Eventos - PLANTERR</title>
    <link rel="stylesheet" href="style.css?v=20251219-1">
    <link rel="stylesheet" href="theme.css?v=20251219-1">
    <script src="nav-back.js?v=20251221-1" defer></script>
    <style>
        .course-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 250px));
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .course-item {
            background: white;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .course-item:hover {
            background: #F4F9FD;
        }

        .course-thumb {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #f0f0f0;
        }

        .course-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .course-info {
            padding: 10px 10px 12px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .course-title {
            margin: 0;
            color: #003366;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.3;
        }

        .course-meta {
            margin-top: 6px;
            color: #666;
            font-size: 11px;
            line-height: 1.35;
        }
        .muted {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="main-header">
            <div style="display:flex; align-items:center; justify-content:center; gap:15px;">
                <a href="/" class="js-back-link" data-fallback="/" aria-label="Voltar" style="display:inline-block;">
                    <img src="img/logo_planter.png" alt="Logo PLANTERR" style="max-height:80px; width:auto;">
                </a>
                <div>
                    <h1 style="margin:0; font-size: 1.5em;">Cursos e Eventos</h1>
                    <p style="margin:5px 0 0 0; font-size: 1em; color: #555;">Clique no evento para ver detalhes e participar.</p>
                </div>
                <img src="img/logo_avalia_horizontal.png" alt="Logo AVALIA+" style="max-height:80px; width:auto;">
            </div>
        </header>

        <section class="panel">
            <div class="panel-body">
                <p class="muted" id="courses-loading">Carregando cursos...</p>
                <div class="course-list" id="courses-list" style="display:none;"></div>
                <p class="muted" id="courses-empty" style="display:none;">Nenhum curso com inscrições abertas no momento.</p>
            </div>
        </section>

        <script>
            function escapeHtml(s) {
                return String(s || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function formatDate(iso) {
                try {
                    if (!iso) return '';
                    return new Date(iso).toLocaleDateString('pt-BR');
                } catch {
                    return '';
                }
            }

            fetch('/api/public-events')
                .then(r => r.json())
                .then(events => {
                    const loading = document.getElementById('courses-loading');
                    const list = document.getElementById('courses-list');
                    const empty = document.getElementById('courses-empty');

                    loading.style.display = 'none';

                    if (!Array.isArray(events) || events.length === 0) {
                        empty.style.display = 'block';
                        return;
                    }

                    list.style.display = 'grid';
                    list.innerHTML = '';

                    events.forEach(e => {
                        const title = escapeHtml(e && e.title ? e.title : 'Curso');
                        const date = formatDate(e && e.date ? e.date : null);
                        const location = escapeHtml(e && e.location ? e.location : '');
                        const id = e && e.id ? String(e.id) : '';
                        const href = id ? ('/eventos/' + encodeURIComponent(id)) : '';
                        const imageUrl = e && e.imageUrl ? escapeHtml(e.imageUrl) : 'img/post_padrao.png';

                        const item = document.createElement('a');
                        item.className = 'course-item';
                        item.href = href || '#';

                        if (!href) {
                            item.addEventListener('click', (ev) => ev.preventDefault());
                        }

                        item.innerHTML =
                            '<div class="course-thumb">' +
                                '<img src="' + imageUrl + '" alt="Post do evento">' +
                            '</div>' +
                            '<div class="course-info">' +
                                '<div class="course-title">' + title + '</div>' +
                                '<div class="course-meta">' +
                                    (date ? ('<div><strong>Data:</strong> ' + date + '</div>') : '') +
                                    (location ? ('<div><strong>Local:</strong> ' + location + '</div>') : '') +
                                '</div>' +
                            '</div>';

                        list.appendChild(item);
                    });
                })
                .catch(err => {
                    console.error(err);
                    const loading = document.getElementById('courses-loading');
                    loading.textContent = 'Erro ao carregar cursos.';
                    loading.style.color = 'red';
                });
        </script>

        <footer style="text-align: center; margin-top: 40px; color: #777; font-size: 0.9em;">
            <!-- Criado por Diego Vidal -->
            <p>&copy; 2025 PLANTERR/UEFS. Todos os direitos reservados.</p>
        </footer>
    </div>
</body>
</html>
