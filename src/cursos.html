<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos e Eventos - PLANTERR</title>
    <link rel="stylesheet" href="style.css?v=20251219-1">
    <link rel="stylesheet" href="theme.css?v=20251219-1">
    <script src="nav-back.js?v=20251221-1" defer></script>
    <style>
        .course-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 16px;
        }
        @media (max-width: 800px) {
            .course-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 500px) {
            .course-list {
                grid-template-columns: 1fr;
            }
        }
        .course-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .course-card h3 {
            margin: 0;
            color: #003366;
        }
        .course-meta {
            color: #666;
            font-size: 0.95em;
            line-height: 1.4;
        }
        .course-actions {
            margin-top: 6px;
            display: flex;
            gap: 10px;
        }
        .course-actions a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            box-sizing: border-box;
        }
        .muted {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="main-header">
            <div style="display:flex; align-items:center; justify-content:center; gap:15px;">
                <a href="/" class="js-back-link" data-fallback="/" aria-label="Voltar" style="display:inline-block;">
                    <img src="img/logo_planter.png" alt="Logo PLANTERR" style="max-height:80px; width:auto;">
                </a>
                <div>
                    <h1 style="margin:0; font-size: 1.5em;">Cursos e Eventos</h1>
                    <p style="margin:5px 0 0 0; font-size: 1em; color: #555;">Selecione o curso para ver detalhes e se inscrever.</p>
                </div>
                <img src="img/logo_avalia_horizontal.png" alt="Logo AVALIA+" style="max-height:80px; width:auto;">
            </div>
        </header>

        <section class="panel">
            <div class="panel-body">
                <p class="muted" id="courses-loading">Carregando cursos...</p>
                <div class="course-list" id="courses-list" style="display:none;"></div>
                <p class="muted" id="courses-empty" style="display:none;">Nenhum curso com inscrições abertas no momento.</p>
            </div>
        </section>

        <script>
            function escapeHtml(s) {
                return String(s || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function formatDate(iso) {
                try {
                    if (!iso) return '';
                    return new Date(iso).toLocaleDateString('pt-BR');
                } catch {
                    return '';
                }
            }

            fetch('/api/public-events')
                .then(r => r.json())
                .then(events => {
                    const loading = document.getElementById('courses-loading');
                    const list = document.getElementById('courses-list');
                    const empty = document.getElementById('courses-empty');

                    loading.style.display = 'none';

                    if (!Array.isArray(events) || events.length === 0) {
                        empty.style.display = 'block';
                        return;
                    }

                    list.style.display = 'grid';
                    list.innerHTML = '';

                    events.forEach(e => {
                        const card = document.createElement('div');
                        card.className = 'course-card';

                        const title = escapeHtml(e && e.title ? e.title : 'Curso');
                        const date = formatDate(e && e.date ? e.date : null);
                        const location = escapeHtml(e && e.location ? e.location : '');
                        const workload = escapeHtml(e && e.workload ? e.workload : '');
                        const speakers = escapeHtml(e && e.speakers ? e.speakers : '');
                        const desc = escapeHtml(e && e.description ? e.description : '');
                        const id = e && e.id ? String(e.id) : '';
                        const imageUrl = e.imageUrl ? escapeHtml(e.imageUrl) : '/img/post_padrao.png';

                        // Aspect ratio 1:1 = 100% padding-top (Square)
                        const imageHtml = '<div class="course-image" style="width:100%; padding-top:100%; position:relative; background:#f0f0f0; border-radius:4px; overflow:hidden; margin-bottom:10px;">' +
                            '<img src="' + imageUrl + '" alt="' + title + '" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;">' +
                            '</div>';

                        card.innerHTML =
                            imageHtml +
                            '<h3>' + title + '</h3>' +
                            '<div class="course-meta">' +
                            (date ? '<div><strong>Data:</strong> ' + date + '</div>' : '') +
                            (location ? '<div><strong>Local:</strong> ' + location + '</div>' : '') +
                            (workload ? '<div><strong>Carga horária:</strong> ' + workload + '</div>' : '') +
                            (speakers ? '<div><strong>Palestrante/Ministrante:</strong> ' + speakers + '</div>' : '') +
                            '</div>' +
                            (desc ? '<div style="white-space: pre-wrap; color:#444;">' + desc + '</div>' : '') +
                            '<div class="course-actions">' +
                            '<a class="btn-secondary" href="/eventos/' + encodeURIComponent(id) + '">Ver e inscrever</a>' +
                            '</div>';

                        list.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error(err);
                    const loading = document.getElementById('courses-loading');
                    loading.textContent = 'Erro ao carregar cursos.';
                    loading.style.color = 'red';
                });
        </script>

        <footer style="text-align: center; margin-top: 40px; color: #777; font-size: 0.9em;">
            <!-- Criado por Diego Vidal -->
            <p>&copy; 2025 PLANTERR/UEFS. Todos os direitos reservados.</p>
        </footer>
    </div>
</body>
</html>
