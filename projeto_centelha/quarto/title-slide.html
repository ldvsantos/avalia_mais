<section id="title-slide" class="slide level1" data-state="title-page" data-background-video="img/video_curto.mp4" data-background-video-loop="true" data-background-video-muted="true" data-background-size="cover">
  <div class="title-grid">
    <div>
      $if(title)$
      <h1 class="title">$title$</h1>
      $endif$
      $if(subtitle)$
      <p class="subtitle">$subtitle$</p>
      $endif$

      <div class="meta">
        $if(author)$<span class="author">$author$</span>$endif$
        $if(date)$<span class="date"> · $date$</span>$endif$
      </div>
    </div>

    <div>
      <img class="title-logo" src="../img/logo_avalia_horizontal.png" alt="Avalia+" />
    </div>
  </div>
</section>
